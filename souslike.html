<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌑 极简魂类 · Ashen</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0c;font-family:serif;touch-action:none;user-select:none;}
  canvas{display:block;position:absolute;top:0;left:0;z-index:1;}
  
  /* 顶部UI */
  #ui-layer{position:absolute;top:15px;left:20px;right:20px;z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:8px;}
  .bar-bg{width:200px;height:12px;background:#222;border:1px solid #444;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;transition:width 0.1s;}
  #hp-bar{background:#8b0000;}
  #stamina-bar{background:#4a6b3a;width:0%;}
  #souls-display{color:#d4af37;font-size:14px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 5px #d4af37;}
  
  /* 屏幕中央提示 */
  #msg-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#8b0000;font-size:28px;font-weight:bold;letter-spacing:4px;display:none;text-align:center;pointer-events:none;text-shadow:0 0 10px rgba(139,0,0,0.8);}
  
  /* 移动端触摸控制 */
  #controls{position:absolute;bottom:0;left:0;right:0;height:40%;z-index:15;pointer-events:none;}
  .touch-btn{position:absolute;bottom:30px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.2);color:#888;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:sans-serif;pointer-events:auto;}
  .touch-btn:active{background:rgba(255,255,255,0.2);color:#fff;}
  
  #btn-attack{right:90px;bottom:50px;width:80px;height:80px;font-size:14px;border-color:#8b0000;color:#8b0000;}
  #btn-roll{right:190px;bottom:30px;width:60px;height:60px;}
  #btn-heal{right:30px;bottom:140px;width:50px;height:50px;border-color:#d4af37;color:#d4af37;}
  
  #joystick-base{position:absolute;bottom:40px;left:40px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.2);pointer-events:auto;}
  #joystick-knob{position:absolute;top:25px;left:25px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.3);}
  
  /* 准星/攻击指示 */
  #crosshair{position:absolute;width:20px;height:20px;z-index:5;pointer-events:none;display:none;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
  <div class="bar-bg"><div id="hp-bar" class="bar-fill" style="width:100%"></div></div>
  <div class="bar-bg" style="height:6px;width:150px;"><div id="stamina-bar" class="bar-fill" style="width:100%"></div></div>
  <div id="souls-display">魂: 0</div>
</div>

<div id="msg-center"></div>

<div id="controls">
  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <button class="touch-btn" id="btn-attack">攻击</button>
  <button class="touch-btn" id="btn-roll">翻滚</button>
  <button class="touch-btn" id="btn-heal">喝药</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize); resize();

/* ================= 游戏状态 ================= */
const state = {
  keys: { w:false, a:false, s:false, d:false },
  joystick: { dx:0, dy:0, active:false },
  player: {
    x: W/2, y: H/2, radius: 12, speed: 3.5,
    hp: 100, maxHp: 100, stamina: 100, maxStamina: 100,
    souls: 0, flasks: 3,
    state: 'idle', // idle, roll, attack, dead
    timer: 0, invuln: false, color: '#e0e0e0',
    attackBox: null
  },
  enemies: [
    { x: W/2 + 150, y: H/2 - 100, radius: 15, hp: 60, maxHp: 60, speed: 1.2, state:'idle', timer:0, color:'#8b0000', attackRange: 50 }
  ],
  bloodstain: null, // 掉落的魂
  camera: { x: 0, y: 0 },
  lastTime: 0
};

/* ================= 输入处理 ================= */
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

joystickBase.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  joyTouchId = touch.identifier;
  state.joystick.active = true;
}, {passive: false});

document.addEventListener('touchmove', (e) => {
  if (!state.joystick.active) return;
  e.preventDefault();
  for (let i=0; i<e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joyTouchId) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width/2;
      const centerY = rect.top + rect.height/2;
      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxDist = rect.width/2 - 10;
      if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
      state.joystick.dx = dx / maxDist;
      state.joystick.dy = dy / maxDist;
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    }
  }
}, {passive: false});

document.addEventListener('touchend', (e) => {
  for (let i=0; i<e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyTouchId) {
      state.joystick.active = false;
      state.joystick.dx = 0; state.joystick.dy = 0;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      joyTouchId = null;
    }
  }
});

// 键盘支持
window.addEventListener('keydown', e => { if(e.key==='w')state.keys.w=true; if(e.key==='a')state.keys.a=true; if(e.key==='s')state.keys.s=true; if(e.key==='d')state.keys.d=true; });
window.addEventListener('keyup', e => { if(e.key==='w')state.keys.w=false; if(e.key==='a')state.keys.a=false; if(e.key==='s')state.keys.s=false; if(e.key==='d')state.keys.d=false; });

// 按钮交互
document.getElementById('btn-attack').addEventListener('touchstart', (e)=>{ e.preventDefault(); performAttack(); });
document.getElementById('btn-roll').addEventListener('touchstart', (e)=>{ e.preventDefault(); performRoll(); });
document.getElementById('btn-heal').addEventListener('touchstart', (e)=>{ e.preventDefault(); performHeal(); });

/* ================= 玩家动作逻辑 ================= */
function performAttack() {
  const p = state.player;
  if (p.state !== 'idle' || p.stamina < 15) return;
  p.state = 'attack'; p.timer = 0.2; p.stamina -= 15;
  // 攻击判定框（以玩家朝向为准，这里简化处理，取面朝方向）
  const angle = Math.atan2(p.dy || 0, p.dx || 0) || 0;
  p.attackBox = {
    x: p.x + Math.cos(angle) * 20,
    y: p.y + Math.sin(angle) * 20,
    r: 30,
    damage: 25
  };
}

function performRoll() {
  const p = state.player;
  if (p.state !== 'idle' || p.stamina < 25) return;
  p.state = 'roll'; p.timer = 0.4; p.invuln = true; p.stamina -= 25;
  // 翻滚方向
  let dx = state.joystick.dx || (state.keys.d?1:0) - (state.keys.a?1:0);
  let dy = state.joystick.dy || (state.keys.s?1:0) - (state.keys.w?1:0);
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  p.rollDx = dx/len; p.rollDy = dy/len;
}

function performHeal() {
  const p = state.player;
  if (p.state !== 'idle' || p.flasks <= 0 || p.hp >= p.maxHp) return;
  p.state = 'heal'; p.timer = 1.0; // 喝药需要1秒硬直
  p.flasks--;
  p.healAmount = 40;
}

/* ================= 核心循环 ================= */
function update(dt) {
  const p = state.player;
  
  // 计时器
  if (p.timer > 0) { p.timer -= dt; }
  else {
    if (p.state === 'attack') { p.state = 'idle'; p.attackBox = null; }
    if (p.state === 'roll') { p.state = 'idle'; p.invuln = false; }
    if (p.state === 'heal') { p.hp = Math.min(p.maxHp, p.hp + p.healAmount); p.state = 'idle'; }
  }

  // 体力恢复
  if (p.state !== 'roll' && p.stamina < p.maxStamina) {
    p.stamina = Math.min(p.maxStamina, p.stamina + 15 * dt);
  }

  // 移动
  if (p.state === 'idle') {
    let dx = state.joystick.dx;
    let dy = state.joystick.dy;
    // 键盘输入兜底
    if (dx === 0 && dy === 0) {
      dx = (state.keys.d?1:0) - (state.keys.a?1:0);
      dy = (state.keys.s?1:0) - (state.keys.w?1:0);
    }
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) {
      p.x += (dx/len) * p.speed * 60 * dt;
      p.y += (dy/len) * p.speed * 60 * dt;
      p.dx = dx/len; p.dy = dy/len; // 记录朝向
    }
  } else if (p.state === 'roll') {
    p.x += p.rollDx * 8 * 60 * dt;
    p.y += p.rollDy * 8 * 60 * dt;
  }

  // 边界限制
  p.x = Math.max(p.radius, Math.min(W - p.radius, p.x));
  p.y = Math.max(p.radius, Math.min(H - p.radius, p.y));

  // 敌人 AI
  state.enemies.forEach(enemy => {
    if (enemy.hp <= 0) return;
    const dx = p.x - enemy.x;
    const dy = p.y - enemy.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > enemy.attackRange) {
      enemy.x += (dx/dist) * enemy.speed * 60 * dt;
      enemy.y += (dy/dist) * enemy.speed * 60 * dt;
      enemy.state = 'idle';
    } else {
      // 进入攻击范围，起手
      enemy.state = 'windup';
      if (!enemy.timer || enemy.timer <= 0) { enemy.timer = 1.0; } // 1秒前摇
    }

    if (enemy.state === 'windup') {
      enemy.timer -= dt;
      if (enemy.timer <= 0) {
        // 判定命中
        if (dist < enemy.attackRange + 10 && !p.invuln && p.state !== 'roll') {
          p.hp -= 30; // 砍一下30血，极痛
          document.getElementById('msg-center').textContent = '受击！';
          document.getElementById('msg-center').style.display = 'block';
          setTimeout(()=>document.getElementById('msg-center').style.display='none', 300);
          if (p.hp <= 0) handleDeath();
        }
        enemy.state = 'idle';
        enemy.timer = 2.0; // 攻击后摇
      }
    } else {
      enemy.timer -= dt; // 后摇冷却
    }
  });

  // 判定玩家攻击命中
  if (p.state === 'attack' && p.attackBox) {
    state.enemies.forEach(enemy => {
      if (enemy.hp <= 0) return;
      const dx = enemy.x - p.attackBox.x;
      const dy = enemy.y - p.attackBox.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < p.attackBox.r + enemy.radius) {
        enemy.hp -= p.attackBox.damage;
        // 击退
        enemy.x += (dx/dist) * 20;
        enemy.y += (dy/dist) * 20;
        p.attackBox = null; // 单次判定
        if (enemy.hp <= 0) {
          p.souls += 50;
          document.getElementById('souls-display').textContent = `魂: ${p.souls}`;
        }
      }
    });
  }
  
  // 检查拾取血渍（掉落的魂）
  if (state.bloodstain && p.state === 'idle') {
    const dx = p.x - state.bloodstain.x;
    const dy = p.y - state.bloodstain.y;
    if (Math.sqrt(dx*dx + dy*dy) < 30) {
      p.souls += state.bloodstain.amount;
      document.getElementById('souls-display').textContent = `魂: ${p.souls}`;
      state.bloodstain = null;
    }
  }
}

/* ================= 死亡逻辑（魂味） ================= */
function handleDeath() {
  const p = state.player;
  p.state = 'dead';
  p.hp = 0;
  
  // 掉落魂
  if (p.souls > 0) {
    state.bloodstain = { x: p.x, y: p.y, amount: p.souls };
  }
  p.souls = 0;
  document.getElementById('souls-display').textContent = `魂: 0`;
  
  // 显示 YOU DIED
  const msg = document.getElementById('msg-center');
  msg.textContent = 'YOU DIED';
  msg.style.display = 'block';
  msg.style.color = '#8b0000';

  // 2秒后重生
  setTimeout(() => {
    msg.style.display = 'none';
    p.x = W/2; p.y = H/2;
    p.hp = p.maxHp; p.stamina = p.maxStamina; p.flasks = 3; p.state = 'idle';
    // 怪物满血重生
    state.enemies.forEach(e => { e.x = W/2 + 150; e.y = H/2 - 100; e.hp = e.maxHp; e.timer = 0; e.state = 'idle'; });
  }, 2000);
}

/* ================= 渲染 ================= */
function render() {
  ctx.clearRect(0, 0, W, H);
  
  // 画网格地面（营造简陋的环境）
  ctx.strokeStyle = '#1a1a1c';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 画血渍（掉落的魂）
  if (state.bloodstain) {
    ctx.beginPath();
    ctx.arc(state.bloodstain.x, state.bloodstain.y, 10, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(212, 175, 55, 0.3)';
    ctx.fill();
    ctx.strokeStyle = '#d4af37';
    ctx.stroke();
  }

  // 画敌人
  state.enemies.forEach(enemy => {
    if (enemy.hp <= 0) return;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2);
    ctx.fillStyle = enemy.state === 'windup' ? '#ff4d4d' : enemy.color;
    ctx.fill();
    ctx.strokeStyle = '#222'; ctx.stroke();
    
    // 敌人血条
    ctx.fillStyle = '#333'; ctx.fillRect(enemy.x - 20, enemy.y - 25, 40, 4);
    ctx.fillStyle = '#8b0000'; ctx.fillRect(enemy.x - 20, enemy.y - 25, 40 * (enemy.hp/enemy.maxHp), 4);
  });

  // 画玩家
  const p = state.player;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
  if (p.invuln) ctx.fillStyle = 'rgba(255,255,255,0.5)';
  else if (p.state === 'heal') ctx.fillStyle = '#d4af37';
  else ctx.fillStyle = p.color;
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.stroke();

  // 画玩家的攻击判定范围
  if (p.state === 'attack' && p.attackBox) {
    ctx.beginPath();
    ctx.arc(p.attackBox.x, p.attackBox.y, p.attackBox.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(200, 50, 50, 0.4)';
    ctx.fill();
  }

  // 更新 UI 条
  document.getElementById('hp-bar').style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
  document.getElementById('stamina-bar').style.width = Math.max(0, (p.stamina / p.maxStamina) * 100) + '%';
}

function loop(time) {
  const dt = Math.min((time - state.lastTime) / 1000, 0.1) || 0;
  state.lastTime = time;
  if (state.player.state !== 'dead') update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
